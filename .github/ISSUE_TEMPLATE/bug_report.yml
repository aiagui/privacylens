name: Bug report
description: Report a reproducible non-security defect
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or sensitive data here. See SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened, without secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Prefer deterministic local fixtures.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
